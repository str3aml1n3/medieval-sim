<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Medieval Sim</title>
<style>
html,body{margin:0;height:100%;background:#111;color:#e8dcc0;font-family:Georgia,serif;overflow:hidden}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
/* Gothic's status bar: BAR_BACK frame with the BAR_HEALTH fill inset into it (both 256x32) */
.gbar{position:relative;width:calc(192px * var(--ui,1));height:calc(24px * var(--ui,1));background:var(--bar-back) 0 0/100% 100% no-repeat}
.gbar .in{position:absolute;left:4.7%;right:4.7%;top:17%;bottom:17%;overflow:hidden}
.gbar .fill{height:100%;width:100%;background:var(--bar-health) 0 0/100% 100% no-repeat}
#hp{position:absolute;left:16px;bottom:16px}
canvas.gt{display:inline-block;vertical-align:top}
#help{position:absolute;right:16px;top:12px;font-size:12px;line-height:1.5;text-align:right;opacity:.8;text-shadow:0 0 4px #000}
#sub{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);max-width:70vw;text-align:center;font-size:20px;text-shadow:0 0 6px #000,0 0 3px #000}
#sub b{color:#e0b860}
#prompt{position:absolute;left:50%;top:62%;transform:translateX(-50%);font-size:18px;text-shadow:0 0 6px #000}
/* Gothic's dialogue choice box: the DLG_CHOICE texture stretched across the whole bottom of the screen, no frame */
#menu{position:absolute;left:0;right:0;bottom:0;background:var(--dlg-choice) 0 0/100% 100% no-repeat;background-color:rgba(0,0,0,.35);padding:calc(10px * var(--ui,1)) 6vw calc(14px * var(--ui,1));display:none;pointer-events:auto;box-sizing:border-box}
#menu div{padding:calc(2px * var(--ui,1)) 0;cursor:pointer}
#msg{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:22px;color:#e0b860;text-shadow:0 0 6px #000}
#start{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;z-index:5;text-align:center}
#start h1{font-weight:normal;letter-spacing:4px;color:#e0b860}
#ftag{position:absolute;transform:translate(-50%,-100%);font-size:15px;white-space:nowrap;text-shadow:0 0 4px #000,0 0 2px #000;display:none}
#ehp{position:absolute;left:50%;top:44px;transform:translateX(-50%);display:none;text-align:center}
#ehp .gbar{margin-top:2px}
#gait{position:absolute;left:18px;bottom:calc(20px + 26px * var(--ui,1))}
#pause{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:4}
#pause .panel{background:rgba(18,14,8,.96);border:1px solid #8a7a50;padding:22px 28px;width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;box-sizing:border-box}
#pause h2{margin:0 0 14px;font-weight:normal;letter-spacing:3px;color:#e0b860;text-align:center}
#pause h3{margin:16px 0 6px;font-weight:normal;color:#e0b860;font-size:15px;border-bottom:1px solid #4a3a1a;padding-bottom:4px}
.legend{width:100%;border-collapse:collapse;font-size:14px}
.legend td{padding:3px 4px;vertical-align:top}.legend td:first-child{white-space:nowrap;width:42%}
kbd{display:inline-block;min-width:18px;padding:1px 6px;margin:1px 2px 1px 0;border:1px solid #8a7a50;border-bottom-width:2px;border-radius:3px;background:#2a2012;font:12px/1.4 Georgia,serif;text-align:center;color:#f0e4c8}
#journal .jtitle{color:#e0b860;margin:2px 0 6px}#journal .jentry{font-size:14px;margin:0 0 6px;padding-left:10px;border-left:2px solid #4a3a1a}#journal .jore{font-size:13px;opacity:.75;margin-top:4px}
.row select{flex:1;font:14px Georgia,serif;color:#e8dcc0;background:#2a2012;border:1px solid #8a7a50;padding:4px 6px}
.row{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:14px}.row label{width:110px}.row input[type=range]{flex:1;accent-color:#b08a40}
.btns{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.btns button{font:15px Georgia,serif;color:#e8dcc0;background:#3a2c14;border:1px solid #8a7a50;padding:7px 18px;cursor:pointer}
.btns button:hover,.btns button:focus-visible{background:#5a4420;color:#fff;outline:none}
#start .legend{max-width:420px;margin:18px auto 0;text-align:left}
</style></head><body>
<div id="hud">
 <div id="ftag"></div>
 <div id="ehp"><div id="ehpn"></div><div class="gbar"><div class="in"><div id="ehpf" class="fill"></div></div></div></div>
 <div id="msg"></div>
 <div id="gait"></div>
 <div id="help"><kbd>Esc</kbd> menu &amp; controls</div>
 <div id="sub"></div><div id="prompt"></div>
 <div id="menu"></div>
 <div id="hp" class="gbar"><div class="in"><div id="hpf" class="fill"></div></div></div>
</div>
<template id="legendTpl"><table class="legend">
 <tr><td>Mouse</td><td>Turn (camera stays behind you)</td></tr>
 <tr><td><kbd>W</kbd> / <kbd>S</kbd></td><td>Run forward / walk back</td></tr>
 <tr><td><kbd>A</kbd> / <kbd>D</kbd></td><td>Strafe</td></tr>
 <tr><td><kbd>Tab</kbd> / <kbd>Shift</kbd> (hold)</td><td>Walk / run: Tab switches for good, Shift while held</td></tr>
 <tr><td><kbd>Alt</kbd> / <kbd>V</kbd></td><td>Jump: forward while moving, straight up when standing; facing a ledge, climb up</td></tr>
 <tr><td><kbd>C</kbd></td><td>Sneak on / off — silent; NPCs only notice what they see</td></tr>
 <tr><td><kbd>Space</kbd> / <kbd>F</kbd></td><td>Draw / sheathe weapon</td></tr>
 <tr><td>Left click</td><td>Attack forward; click again as the swing ends to chain a combo (too early breaks it)</td></tr>
 <tr><td><kbd>A</kbd>/<kbd>D</kbd> + left click</td><td>Swing left / right</td></tr>
 <tr><td>Right click, or <kbd>S</kbd> + left click</td><td>Parry a blow from the front</td></tr>
 <tr><td><kbd>S</kbd> (weapon drawn)</td><td>Jump back</td></tr>
 <tr><td><kbd>T</kbd></td><td>One-handed talent: untrained → trained → master (longer combos)</td></tr>
 <tr><td><kbd>E</kbd></td><td>Talk to a nearby NPC (weapon sheathed)</td></tr>
 <tr><td>Mouse wheel + left click, <kbd>↑</kbd>/<kbd>↓</kbd> + <kbd>Enter</kbd>, or <kbd>1</kbd>–<kbd>7</kbd></td><td>Pick a dialogue option; right click skips the line being spoken</td></tr>
 <tr><td><kbd>M</kbd></td><td>Music on / off</td></tr>
 <tr><td><kbd>R</kbd></td><td>Get back up after being knocked down</td></tr>
 <tr><td><kbd>Esc</kbd> / <kbd>P</kbd></td><td>Pause menu</td></tr>
</table></template>
<template id="legendModern"><table class="legend">
 <tr><td>Mouse</td><td>Turn (camera stays behind you)</td></tr>
 <tr><td><kbd>W</kbd> / <kbd>S</kbd></td><td>Run forward / walk back</td></tr>
 <tr><td><kbd>A</kbd> / <kbd>D</kbd></td><td>Turn on the spot</td></tr>
 <tr><td>Right mouse (hold) + <kbd>A</kbd> / <kbd>D</kbd></td><td>Strafe</td></tr>
 <tr><td>Action + <kbd>Space</kbd> + <kbd>A</kbd> / <kbd>D</kbd></td><td>Strafe around the target in focus (without Space: swing left / right)</td></tr>
 <tr><td><kbd>Tab</kbd> / <kbd>Shift</kbd> (hold)</td><td>Walk / run: Tab switches for good, Shift while held</td></tr>
 <tr><td><kbd>Space</kbd></td><td>Jump; facing a ledge, climb up</td></tr>
 <tr><td><kbd>X</kbd></td><td>Sneak on / off — silent; NPCs only notice what they see</td></tr>
 <tr><td><kbd>Ctrl</kbd></td><td>Draw / sheathe weapon</td></tr>
 <tr><td>Left mouse or <kbd>E</kbd></td><td>Action: hold to lock the focus on the target in front; weapon sheathed: talk to a nearby NPC</td></tr>
 <tr><td>Action + <kbd>W</kbd></td><td>Attack forward; press <kbd>W</kbd> again as the swing ends to chain a combo (too early breaks it)</td></tr>
 <tr><td>Action + <kbd>A</kbd> / <kbd>D</kbd></td><td>Swing left / right</td></tr>
 <tr><td>Right mouse + <kbd>S</kbd>, or action + <kbd>S</kbd></td><td>Parry a blow from the front</td></tr>
 <tr><td><kbd>Space</kbd> + <kbd>S</kbd> (weapon drawn)</td><td>Jump back</td></tr>
 <tr><td><kbd>R</kbd> (hold)</td><td>Look back; when knocked down, get back up</td></tr>
  <tr><td>Mouse wheel + left click, <kbd>↑</kbd>/<kbd>↓</kbd> + <kbd>Enter</kbd>, or <kbd>1</kbd>–<kbd>7</kbd></td><td>Pick a dialogue option; right click skips the line being spoken</td></tr>
 <tr><td><kbd>T</kbd></td><td>One-handed talent: untrained → trained → master (longer combos)</td></tr>
 <tr><td><kbd>M</kbd></td><td>Music on / off</td></tr>
 <tr><td><kbd>Esc</kbd> / <kbd>P</kbd></td><td>Pause menu</td></tr>
</table></template>
<div id="start"><h1 id="startTitle">THE ARENA</h1><div id="loadmsg">Loading…</div><div id="startLegend"></div></div>
<div id="pause" role="dialog" aria-modal="true" aria-labelledby="pauseTitle"><div class="panel">
 <h2 id="pauseTitle">PAUSED</h2>
 <h3>Controls</h3>
 <div class="row"><label for="scheme">Scheme</label><select id="scheme"><option value="modern">Modern (left mouse / E action + W/A/D attack, right parry)</option><option value="gothic">Gothic (original keys)</option></select></div>
 <div id="pauseLegend"></div>
 <h3>Journal</h3><div id="journal"></div>
 <h3>Sound</h3>
 <div class="row"><label for="volMusic">Music</label><input id="volMusic" type="range" min="0" max="100" value="70"><span id="musicSrc" style="font-size:12px;opacity:.7"></span></div>
 <div class="row"><label for="volSfx">Effects &amp; voices</label><input id="volSfx" type="range" min="0" max="100" value="100"></div>
 <h3>Picture</h3>
 <div class="row"><label for="weather">Weather</label><select id="weather"><option value="dynamic">Dynamic (showers come and go)</option><option value="clear">Clear</option><option value="rain">Rain</option></select></div>
 <div class="row"><label for="bright">Brightness</label><input id="bright" type="range" min="70" max="250" value="100"></div>
 <h3>Mouse &amp; fighting</h3>
 <div class="row"><label for="sens">Mouse speed</label><input id="sens" type="range" min="30" max="250" value="100"></div>
 <div class="row"><label>One-handed</label><span id="style"></span><span style="font-size:12px;opacity:.7">(<kbd>T</kbd> to change)</span></div>
 <div class="btns"><button id="btnResume">Resume</button><button id="btnRestart">Restart arena</button></div>
</div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module" src="game.js"></script>
</body></html>
