name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', 'standin/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Published: the engine (web/) and the original stand-in assets (standin/), side by side as the game expects,
      # so the hosted page is playable. Extracted Gothic assets (export/) are copyrighted, git-ignored and never
      # deployed. See README for local setup.
      - name: Stage site
        run: |
          mkdir -p _site
          cp -r web standin _site/
          echo '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=web/"><a href="web/">medieval-sim</a>' > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
